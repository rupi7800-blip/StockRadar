# Versione statica di Stock Radar su GitHub Pages.
# Ogni 30 minuti: raccoglie quotazioni e notizie, traduce/analizza (se ci sono chiavi AI nei Secrets), genera il sito e lo pubblica.
# Prerequisito (una volta): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Pubblica su GitHub Pages

on:
  schedule:
    - cron: '7,37 * * * *'   # ogni 30 minuti (GitHub può ritardare le esecuzioni programmate)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      STATIC_DAYS: '7'
      ARCHIVE_RETENTION_DAYS: '30'
      NEXT_PUBLIC_UPDATE_EVERY_MIN: '30'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Il database (archivio, traduzioni, analisi AI, stato fonti) sopravvive tra le esecuzioni grazie alla cache
      - name: Ripristina database
        uses: actions/cache/restore@v4
        with:
          path: data
          key: srdb-${{ github.run_id }}
          restore-keys: srdb-

      - name: Raccolta dati
        run: npm run ingest
        env:
          STATIC_INGEST: '1'
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD }}

      - name: Salva database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: srdb-${{ github.run_id }}

      - name: Genera sito statico
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
